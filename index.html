<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Privacy Policies</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #f4f6fa;
  color: #23272f;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  line-height: 1.6;
}
.wrap { max-width: 720px; margin: 0 auto; padding: 40px 20px 60px; }
h1 { margin: 0 0 6px; font-size: 26px; }
.sub { margin: 0 0 26px; color: #5b6470; }
ul.apps { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
li.app {
  background: #ffffff;
  border: 1px solid #e2e7ef;
  border-left: 6px solid #5b6470;
  border-radius: 12px;
  padding: 16px 18px;
}
li.app h2 { margin: 0 0 8px; font-size: 18px; }
.langs { margin: 0; }
.langs a { font-weight: 700; text-decoration: none; margin-right: 16px; }
.langs a:hover { text-decoration: underline; }
.driving { border-left-color: #1F4E9C; }
.driving h2, .driving a { color: #1F4E9C; }
.car { background: #1C2026; border-color: #1C2026; border-left-color: #FFB020; }
.car h2 { color: #F5F7FA; }
.car a { color: #FFB020; }
.hsk { border-left-color: #C8372D; }
.hsk h2, .hsk a { color: #C8372D; }
.eps { border-left-color: #1D3557; }
.eps h2, .eps a { color: #1D3557; }
.note { margin-top: 28px; color: #5b6470; font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Privacy Policies</h1>
  <p class="sub">Choose an app and a language / Выберите приложение и язык.</p>
  <ul class="apps">
    <li class="app driving">
      <h2>Driving</h2>
      <p class="langs"><a href="driving/en.html">English</a><a href="driving/ru.html">Русский</a></p>
    </li>
    <li class="app hsk">
      <h2>HSK</h2>
      <p class="langs"><a href="hsk/en.html">English</a><a href="hsk/ru.html">Русский</a></p>
    </li>
    <li class="app eps">
      <h2>EPS</h2>
      <p class="langs"><a href="eps/en.html">English</a><a href="eps/ru.html">Русский</a></p>
    </li>
  </ul>
  <p class="note">All policies were last updated on 2026-09-29.</p>
</div>
</body>
</html>
